[workspace]
resolver = "2"
members = [
    "apps/provider",
    "crates/soul-core",
    "crates/soul-prover",
    "crates/soul-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/AbdelStark/SoulSociety"
authors = ["Abdel <abdel@starkware.co>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "=1.53.1", features = ["full"] }

# Serialization
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# Error handling
thiserror = "=2.0.20"
anyhow = "=1.0.104"

# Logging
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Nostr
nostr-sdk = "=0.45.1"
nostr = "=0.45.1"

# Crypto
hex = "=0.4.3"
sha2 = "=0.11.0"
url = "=2.5.8"

# Shared STWO verifier types
cairo-air = "=1.3.0"
starknet-ff = "=0.3.7"
stwo = "=2.3.0"
stwo-cairo-common = "=1.3.0"

# WASM
wasm-bindgen = "=0.2.126"
console_error_panic_hook = "=0.1.7"

# Testing
tokio-test = "=0.4.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1
