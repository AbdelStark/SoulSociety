[package]
name = "soul-wasm"
description = "WASM bindings for Soul Society browser verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soul-core = { path = "../soul-core", default-features = false }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }

# Verifier-only dependencies. The browser bundle never links the prover or the
# Cairo VM.
cairo-air = { workspace = true }
stwo = { workspace = true }
stwo-cairo-common = { workspace = true }
starknet-ff = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "=0.3.76"

[features]
default = ["panic_hook"]
panic_hook = ["console_error_panic_hook"]
real-proof-fixture = []
