[package]
name = "soul-core"
description = "Soul Wire types, validation, and proof statements for verifiable Cairo jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["nostr-events"]
nostr-events = ["dep:nostr"]

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Signed Nostr event validation
nostr = { workspace = true, optional = true }

# Proof URL validation
url = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
